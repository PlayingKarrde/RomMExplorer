[package]
name = "romm-explorer"
version = "0.1.0"
edition = "2021"
description = "A modern desktop client to browse your RomM collection and install ROMs into a local, organised library."
repository = "https://github.com/PlayingKarrde/RomMExplorer"
readme = "README.md"

[dependencies]
eframe = "0.32"
egui = "0.32"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp"] }
reqwest = { version = "0.12", features = ["blocking", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "6"
rfd = "0.15"
zip = { version = "2", default-features = false, features = ["deflate"] }
open = "5"
anyhow = "1"
chrono = "0.4"

[profile.release]
opt-level = 3
lto = "thin"
strip = true

[profile.dev.package."*"]
opt-level = 2
